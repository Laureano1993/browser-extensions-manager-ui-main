<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Browser extensions manager UI</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="nav__logo">
        <img src="assets/images/logo.svg" alt="logo" srcset="" id="logo">
      </div>
      <div class="nav__switch">
        <img src="assets/images/icon-moon.svg" alt="icon switch" id="icon-switch">
      </div>
    </nav>

    <div class="states">
      <h1>Extensions List</h1>
      <div class="states__buttons">
        <button class="btn-state isSelected" id="all">All</button>
        <button class="btn-state" id="active">Active</button>
        <button class="btn-state" id="inactive">Inactive</button>
      </div>
    </div>
  </header>

  <main>
    <div class="list"></div>
  </main>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Laureano1993</a>.
  </div>

  <script src="dist/extension.js"></script>
  <script src="dist/dark-mode.js"></script>
</body>
</html>
